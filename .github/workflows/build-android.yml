      - name: Check signing secrets
        shell: bash
        env:
          QADAM_KEYSTORE_BASE64: ${{ secrets.QADAM_KEYSTORE_BASE64 }}
          QADAM_KEYSTORE_PASSWORD: ${{ secrets.QADAM_KEYSTORE_PASSWORD }}
          QADAM_KEY_ALIAS: ${{ secrets.QADAM_KEY_ALIAS }}
          QADAM_KEY_PASSWORD: ${{ secrets.QADAM_KEY_PASSWORD }}
        run: |
          test -n "$QADAM_KEYSTORE_BASE64" || { echo "::error::Missing secret QADAM_KEYSTORE_BASE64"; exit 1; }
          test -n "$QADAM_KEYSTORE_PASSWORD" || { echo "::error::Missing secret QADAM_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$QADAM_KEY_ALIAS" || { echo "::error::Missing secret QADAM_KEY_ALIAS"; exit 1; }
          test -n "$QADAM_KEY_PASSWORD" || { echo "::error::Missing secret QADAM_KEY_PASSWORD"; exit 1; }
          printf '%s' "$QADAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qadam.keystore"

      - name: Build signed APK
        env:
          QADAM_KEYSTORE_PATH: ${{ runner.temp }}/qadam.keystore
          QADAM_KEYSTORE_PASSWORD: ${{ secrets.QADAM_KEYSTORE_PASSWORD }}
          QADAM_KEY_ALIAS: ${{ secrets.QADAM_KEY_ALIAS }}
          QADAM_KEY_PASSWORD: ${{ secrets.QADAM_KEY_PASSWORD }}
        run: gradle -p qadam_native_android :app:assembleRelease --stacktrace

      - name: Prepare APK
        shell: bash
        run: cp qadam_native_android/app/build/outputs/apk/release/app-release.apk Qadam-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Qadam-Android-v2.0.0
          path: Qadam-v2.0.0.apk
          if-no-files-found: error
